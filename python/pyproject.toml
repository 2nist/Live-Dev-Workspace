[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "live-dev-integration"
version = "1.0.0"
description = "Integrated Python tools for Ableton Live and Max for Live development"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ALSE Development Team", email = "dev@example.com"}
]
keywords = ["ableton", "live", "max-for-live", "m4l", "osc", "midi", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pylive>=0.4.0",
    "python-osc>=1.8.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-asyncio>=0.21.0",
]
audio = [
    "mido>=1.3.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/2nist/Live-Dev-Workspace"
Repository = "https://github.com/2nist/Live-Dev-Workspace"
Documentation = "https://github.com/2nist/Live-Dev-Workspace/blob/main/python/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --timeout=30"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
