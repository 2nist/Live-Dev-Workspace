<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arranger Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #ff6b35;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-indicator.on { background: #4caf50; }
        .status-indicator.off { background: #757575; }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 8px;
        }
        button:hover { background: #ff8552; }
        button:active { background: #e6522e; }
        button.secondary {
            background: #555;
        }
        button.secondary:hover { background: #666; }
        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
        }
        input[type="range"] {
            padding: 0;
        }
        .value-display {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b35;
            margin: 10px 0;
        }
        .reply-box {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
            color: #4caf50;
        }
        .scene-list {
            list-style: none;
        }
        .scene-item {
            background: #3a3a3a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scene-item button {
            width: auto;
            padding: 6px 12px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Arranger Dashboard</h1>
        
        <div class="grid">
            <!-- Transport -->
            <div class="card">
                <h2>Transport</h2>
                <div class="control-group">
                    <label>
                        <span class="status-indicator" id="playIndicator"></span>
                        Status: <span id="playStatus">Stopped</span>
                    </label>
                </div>
                <button id="playBtn">▶ Play</button>
                <button id="stopBtn" class="secondary">⏹ Stop</button>
            </div>

            <!-- Tempo -->
            <div class="card">
                <h2>Tempo</h2>
                <div class="value-display" id="tempoDisplay">120</div>
                <div class="control-group">
                    <input type="range" id="tempoSlider" min="60" max="180" value="120" step="0.5">
                </div>
                <button id="setTempoBtn">Set Tempo</button>
            </div>

            <!-- Scene Control -->
            <div class="card">
                <h2>Scenes</h2>
                <div class="control-group">
                    <label>Quick Actions</label>
                    <button id="createSceneBtn">+ New Scene</button>
                    <button id="triggerScene0Btn" class="secondary">▶ Trigger Scene 0</button>
                </div>
            </div>

            <!-- Clip Creation -->
            <div class="card">
                <h2>Clips</h2>
                <div class="control-group">
                    <label>Track</label>
                    <input type="number" id="clipTrack" value="0" min="0">
                </div>
                <div class="control-group">
                    <label>Scene</label>
                    <input type="number" id="clipScene" value="0" min="0">
                </div>
                <div class="control-group">
                    <label>Length (bars)</label>
                    <input type="number" id="clipLength" value="4" min="1" step="0.25">
                </div>
                <button id="createClipBtn">Create Clip</button>
            </div>

            <!-- Track Control -->
            <div class="card">
                <h2>Track Volume</h2>
                <div class="control-group">
                    <label>Track Index</label>
                    <input type="number" id="volumeTrack" value="0" min="0">
                </div>
                <div class="control-group">
                    <label>Volume: <span id="volumeValue">0.85</span></label>
                    <input type="range" id="volumeSlider" min="0" max="1" value="0.85" step="0.01">
                </div>
                <button id="setVolumeBtn">Set Volume</button>
            </div>

            <!-- Server Reply -->
            <div class="card">
                <h2>Server Replies</h2>
                <div class="reply-box" id="replyBox">Waiting for messages...</div>
            </div>
        </div>
    </div>

    <script>
        // State polling
        let state = { tempo: 120, playing: false, last_reply: "" };

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                state = await res.json();
                updateUI();
            } catch (e) {
                console.error('Failed to fetch state:', e);
            }
        }

        function updateUI() {
            document.getElementById('tempoDisplay').textContent = Math.round(state.tempo * 10) / 10;
            document.getElementById('tempoSlider').value = state.tempo;
            
            const indicator = document.getElementById('playIndicator');
            const statusText = document.getElementById('playStatus');
            if (state.playing) {
                indicator.className = 'status-indicator on';
                statusText.textContent = 'Playing';
            } else {
                indicator.className = 'status-indicator off';
                statusText.textContent = 'Stopped';
            }

            if (state.last_reply) {
                document.getElementById('replyBox').textContent = state.last_reply;
            }
        }

        // Tempo slider
        document.getElementById('tempoSlider').addEventListener('input', (e) => {
            document.getElementById('tempoDisplay').textContent = e.target.value;
        });

        // Volume slider
        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            document.getElementById('volumeValue').textContent = e.target.value;
        });

        // Play
        document.getElementById('playBtn').addEventListener('click', async () => {
            await fetch('/api/play', { method: 'POST' });
            fetchState();
        });

        // Stop
        document.getElementById('stopBtn').addEventListener('click', async () => {
            await fetch('/api/stop', { method: 'POST' });
            fetchState();
        });

        // Set Tempo
        document.getElementById('setTempoBtn').addEventListener('click', async () => {
            const tempo = parseFloat(document.getElementById('tempoSlider').value);
            await fetch('/api/tempo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tempo })
            });
            fetchState();
        });

        // Create Scene
        document.getElementById('createSceneBtn').addEventListener('click', async () => {
            await fetch('/api/scene/create', { method: 'POST' });
            fetchState();
        });

        // Trigger Scene 0
        document.getElementById('triggerScene0Btn').addEventListener('click', async () => {
            await fetch('/api/scene/trigger/0', { method: 'POST' });
            fetchState();
        });

        // Create Clip
        document.getElementById('createClipBtn').addEventListener('click', async () => {
            const track = parseInt(document.getElementById('clipTrack').value);
            const scene = parseInt(document.getElementById('clipScene').value);
            const length = parseFloat(document.getElementById('clipLength').value);
            await fetch('/api/clip/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track, scene, length })
            });
            fetchState();
        });

        // Set Volume
        document.getElementById('setVolumeBtn').addEventListener('click', async () => {
            const track = parseInt(document.getElementById('volumeTrack').value);
            const volume = parseFloat(document.getElementById('volumeSlider').value);
            await fetch('/api/track/volume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track, volume })
            });
            fetchState();
        });

        // Auto-refresh state every 2 seconds
        setInterval(fetchState, 2000);
        fetchState();
    </script>
</body>
</html>
